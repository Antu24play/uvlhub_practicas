name: Deploy to Render

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-pr:
    name: Tagged commit comes from an approved and merged PR
    runs-on: ubuntu-24.04
    env:
      REQUIRED_APPROVALS: "1"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tagged commit must be on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - name: Tagged commit must come from a merged and approved pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number')
          if [ -z "$prs" ]; then
            echo "::error::Commit $GITHUB_SHA does not belong to any merged pull request into main"
            exit 1
          fi
          for pr in $prs; do
            approvals=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
              --jq '[.[] | select(.state == "APPROVED")] | length')
            echo "PR #$pr: $approvals approval(s), required: $REQUIRED_APPROVALS"
            if [ "$approvals" -ge "$REQUIRED_APPROVALS" ]; then
              exit 0
            fi
          done
          echo "::error::No merged pull request with enough approvals for this commit"
          exit 1

  tests:
    name: Run tests
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      - name: Run tests
        run: pytest app/features/ --ignore-glob='*selenium*'
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

  deploy:
    name: Deploy to Render
    needs: [verify-pr, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deploy hook
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail "$deploy_url"
